name: Windows · MXU 界面安装包与便携版

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mxu-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: MXU + MaaFramework Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
    steps:
      - name: 检出 Maa Local Lab
        uses: actions/checkout@v4

      - name: 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: 校验 ProjectInterface V2 与 Pipeline
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "PI V2 单元测试失败" }
          python -m py_compile demo_app.py scripts/stage_mxu.py scripts/validate_mxu.py
          if ($LASTEXITCODE -ne 0) { throw "Python 语法检查失败" }

      - name: 生成独立实验窗口 EXE
        run: |
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 安装失败" }
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name maa-lab-target demo_app.py
          if ($LASTEXITCODE -ne 0) { throw "实验窗口打包失败" }
          & "dist/maa-lab-target/maa-lab-target.exe" --self-check
          if ($LASTEXITCODE -ne 0) { throw "实验窗口自检失败" }

      - name: 获取官方 MXU v2.7.1 与 MaaFramework v5.14.3
        run: |
          New-Item -ItemType Directory -Force -Path ".cache/mxu", ".cache/maafw" | Out-Null
          gh release download v2.7.1 --repo MistEO/MXU --pattern 'MXU-win-x86_64-v2.7.1.zip' --dir '.cache/mxu'
          if ($LASTEXITCODE -ne 0) { throw "MXU 官方包下载失败" }
          gh release download v5.14.3 --repo MaaXYZ/MaaFramework --pattern 'MAA-win-x86_64-v5.14.3.zip' --dir '.cache/maafw'
          if ($LASTEXITCODE -ne 0) { throw "MaaFramework 官方包下载失败" }

      - name: 组装完整 MXU Windows 发行目录
        run: |
          python scripts/stage_mxu.py --mxu .cache/mxu/MXU-win-x86_64-v2.7.1.zip --maafw .cache/maafw/MAA-win-x86_64-v5.14.3.zip --target dist/maa-lab-target --out release/portable
          if ($LASTEXITCODE -ne 0) { throw "MXU 打包失败" }
          python scripts/validate_mxu.py --root release/portable --staged
          if ($LASTEXITCODE -ne 0) { throw "发行包资源检查失败" }

      - name: 构建用户级 NSIS 安装程序
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS 安装失败" }
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { throw "未找到 makensis.exe" }
          & $makensis "installers/windows-mxu.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS 打包失败" }
          if (!(Test-Path "release/Maa-Local-Lab-MXU-setup-win-x64.exe")) { throw "安装程序未生成" }

      - name: 生成便携包及 SHA256
        run: |
          Compress-Archive -Path "release/portable/*" -DestinationPath "release/Maa-Local-Lab-MXU-portable-win-x64.zip" -Force
          Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path $_.Path -Leaf)" } | Set-Content "release/SHA256SUMS.txt" -Encoding utf8
          Get-ChildItem release -File | Select-Object Name,Length | Format-Table

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: Maa-Local-Lab-MXU-Windows-x64
          path: |
            release/Maa-Local-Lab-MXU-setup-win-x64.exe
            release/Maa-Local-Lab-MXU-portable-win-x64.zip
            release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release（main 快照 / v* 正式版）
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('snapshot-mxu-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Maa Local Lab {0} · MXU', github.ref_name) || format('Maa Local Lab MXU 快照 run-{0}', github.run_number) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Maa-Local-Lab-MXU-setup-win-x64.exe
            release/Maa-Local-Lab-MXU-portable-win-x64.zip
            release/SHA256SUMS.txt
